# SPDX-License-Identifier: Apache-2.0
#
# The benchmark stack: one backend and the WAFs under test in front of it. Nothing here is published
# on the host — the load generator and gotestwaf run as containers on the same network (run.sh).
#
# CPU pinning keeps the comparison fair: every WAF gets the same cores (only one is under load at a
# time), the backend and the load generator get their own. Override the sets in run.sh's environment
# (WAF_CPUS / BACKEND_CPUS) to match your machine.

name: light-waf-bench

services:
  # A backend that answers 200 to everything, as cheaply as possible, so the numbers are the WAF's.
  backend:
    image: nginx:1.27.5-alpine
    cpuset: "${BACKEND_CPUS:-2}"
    volumes:
      - ./backend.conf:/etc/nginx/conf.d/default.conf:ro

  lightwaf:
    image: ghcr.io/0x00spor3/waf-enterprise:${LIGHTWAF_VERSION:-1.0.1}
    cpuset: "${WAF_CPUS:-0-1}"
    volumes:
      - ./lightwaf.toml:/etc/waf/config.toml:ro
    depends_on: [backend]

  # The strict profile: paranoia 4, threshold 3 (examples/strict.toml's detection settings).
  lightwaf-strict:
    image: ghcr.io/0x00spor3/waf-enterprise:${LIGHTWAF_VERSION:-1.0.1}
    cpuset: "${WAF_CPUS:-0-1}"
    volumes:
      - ./lightwaf-strict.toml:/etc/waf/config.toml:ro
    depends_on: [backend]

  # ModSecurity v3 + OWASP CRS on nginx, the reference open-source WAF. Default paranoia (PL1) and
  # the default inbound anomaly threshold (5), as shipped.
  modsec-pl1:
    image: owasp/modsecurity-crs:4.30.0-nginx-202610051210
    cpuset: "${WAF_CPUS:-0-1}"
    environment: &modsec-env
      BACKEND: http://backend:80
      PORT: "8080"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      # Request inspection only, like Light WAF (which does not inspect responses).
      MODSEC_RESP_BODY_ACCESS: "Off"
    depends_on: [backend]

  # The same at paranoia level 2 — closer to Light WAF's recommended baseline (balanced.toml, PL2).
  modsec-pl2:
    image: owasp/modsecurity-crs:4.30.0-nginx-202610051210
    cpuset: "${WAF_CPUS:-0-1}"
    environment:
      <<: *modsec-env
      PARANOIA: "2"
      BLOCKING_PARANOIA: "2"
    depends_on: [backend]

  # The CRS at the strict profile's settings: paranoia 4, inbound threshold 3. At this level the CRS
  # also blocks the clean benchmark requests (it is meant to be run with rule exclusions), so it is
  # in the detection comparison only, not in the performance one.
  modsec-strict:
    image: owasp/modsecurity-crs:4.30.0-nginx-202610051210
    cpuset: "${WAF_CPUS:-0-1}"
    environment:
      <<: *modsec-env
      PARANOIA: "4"
      BLOCKING_PARANOIA: "4"
      ANOMALY_INBOUND: "3"
    depends_on: [backend]
