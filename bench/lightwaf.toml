# SPDX-License-Identifier: Apache-2.0
# Light WAF under benchmark: the recommended production baseline (examples/balanced.toml) with the
# per-IP rate limit removed — the load generator is a single client, and a 429 wall would measure
# the limiter, not the inspection.

[proxy]
listen  = "0.0.0.0:8080"
backend = "http://backend:80"

[waf]
mode            = "blocking"
block_threshold = 5
paranoia_level  = 2

[waf.severity_scores]
critical = 6
error    = 4
warning  = 3
notice   = 2

[resilience]
on_upstream_error   = "fail_closed"
on_internal_error   = "fail_open"
on_config_error     = "fail_open"
on_parser_limit     = "fail_closed"
upstream_timeout_ms = 30000

[network]
trusted_proxies  = []
client_ip_header = "X-Forwarded-For"
trusted_hops     = 1

[limits]
max_body_size   = 1048576
max_header_size = 8192
max_headers     = 100
max_params      = 100
max_cookies     = 50
max_json_depth  = 20

[modules]
sqli              = { enabled = true }
xss               = { enabled = true }
path_traversal    = { enabled = true }
rce               = { enabled = true }
lfi_rfi           = { enabled = true }
ssrf              = { enabled = true }
ldap              = { enabled = true }
nosql             = { enabled = true }
mail              = { enabled = true }
ssti              = { enabled = true }
scanner           = { enabled = true }
ssi               = { enabled = true }
xxe               = { enabled = true }
header_injection  = { enabled = true }
request_smuggling = { enabled = true }
