# E2E — token mode (governance OFF). The api_token comes from WAF_CP_API_TOKEN (set by the harness).
[controlplane]
listen = "127.0.0.1:9701"
retention_days = 30

# API attack-surface inventory (§4-B pt3 discovery). Path is relative to the webServer cwd (ui/).
[controlplane.api_inventory]
spec_path = "tests/e2e/openapi.json"
