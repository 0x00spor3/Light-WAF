[package]
name = "waf-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kubernetes operator for Light WAF: reconciles a WafProxy custom resource into a data-plane Deployment in front of a target Service."
# Shipped as a container image / Helm chart, not on crates.io (see BOUNDARY.md and the release notes).
publish = false

# DELIBERATELY does NOT depend on waf-core / waf-proxy: the operator is a control-plane
# component that GENERATES manifests (it never inspects traffic). It renders the same
# data-plane shape as charts/waf, driven by a CR. Zero datapath.
[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { workspace = true }
serde_json = "1"
# YAML for the CRD dump (`waf-operator crd`). The same pure-Rust serde-saphyr kube itself uses (it
# replaced the unmaintained serde_yaml / unsafe-libyaml), so there is one YAML crate in the tree.
serde-saphyr = "0.0.29"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2"
futures = "0.3"
schemars = "1"
# `ring`: the rustls crypto provider, like the rest of the workspace (no aws-lc-rs).
kube = { version = "4.2", default-features = false, features = [
    "client",
    "runtime",
    "derive",
    "rustls-tls",
    "ring",
] }
# The oldest Kubernetes API k8s-openapi 0.28 supports; newer clusters serve it too.
k8s-openapi = { version = "0.28", features = ["v1_32"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Parse the rendered config.toml in tests to prove it is well-formed + carries the right values.
toml = { workspace = true }
# Tests only: check the rendered config against the WAF's real config type. The operator
# binary itself still does not link waf-core (see above).
waf-core = { workspace = true }
