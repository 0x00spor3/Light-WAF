[package]
name = "waf-license"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Demo/trial license gate for the Light WAF enterprise binaries — a signed, time-limited license (§demo, enterprise, BSL 1.1)."
# Explicit bins only (the two vendor tools); no auto-discovery so the file names don't create
# extra default-named binaries.
autobins = false

# Enterprise-only, zero-core, zero-datapath: a small LIBRARY the three enterprise binaries link
# (behind their `demo-license` feature) to gate startup on a signed, time-limited license. It does
# NOT depend on `waf-core` nor on `waf-governance`; it reuses `ring` (Ed25519 + SHA-256) directly,
# the same trust primitive as the audit hash-chain, with no new crypto crate.
[dependencies]
# Ed25519 sign/verify + SHA-256 — same `ring` line as `waf-governance` (no new crypto crate).
ring = "0.17"
hex = "0.4"
serde = { workspace = true }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
thiserror = "2"
# Only for the background watchdog's `sleep`.
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

# The vendor tools (run offline; NEVER shipped inside a demo binary). Keygen mints the Ed25519
# keypair; sign issues a `license.json` from the private seed.
[[bin]]
name = "waf-license-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "waf-license-sign"
path = "src/bin/sign.rs"
