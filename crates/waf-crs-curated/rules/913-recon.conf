# SPDX-License-Identifier: Apache-2.0
# Light WAF — curated premium ruleset: reconnaissance / exposure.
#
# These are PREMIUM-ADDITIVE signatures: they ADD to the OPEN native modules, never replace the
# baseline (BOUNDARY §2.4). IDs live in the reserved 9000000+ range. Only v1-subset constructs
# (@rx / @pm on supported targets) — the compat gate (`tests/gate.rs`) asserts every rule loads.

# Modern reconnaissance / fuzzing tool User-Agents (beyond the baseline scanner list).
SecRule REQUEST_HEADERS:User-Agent "@pm nuclei feroxbuster httpx dirsearch gobuster" \
    "id:9000001,phase:1,severity:WARNING,msg:'premium: modern recon tool User-Agent'"

# Exposed VCS metadata probe — attempts to read a deployed .git repository.
SecRule REQUEST_URI "@rx (?i)/\.git/(config|head|index)" \
    "id:9000002,phase:1,severity:ERROR,msg:'premium: exposed .git repository access attempt'"

# Sensitive dotfile / credential file probe (.env, .htpasswd, cloud creds, …).
SecRule REQUEST_URI "@rx (?i)/\.(env|htpasswd|htaccess|aws/credentials)\b" \
    "id:9000010,phase:1,severity:ERROR,msg:'premium: sensitive dotfile / credential file access'"

# Backup / source-leftover file probe (editors, DB dumps).
SecRule REQUEST_URI "@rx (?i)\.(bak|old|swp|sql)(\?|$)" \
    "id:9000011,phase:1,severity:WARNING,msg:'premium: backup / source file probe'"
