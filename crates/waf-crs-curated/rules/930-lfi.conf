# SPDX-License-Identifier: Apache-2.0
# Light WAF — curated premium ruleset: high-signal LFI / stream-wrapper targets.

# PHP stream wrappers used for LFI-to-RCE (php://filter, data://, expect://).
SecRule ARGS "@rx (?i)php://(filter|input|data|expect)" \
    "id:9000031,phase:2,severity:CRITICAL,msg:'premium: PHP stream wrapper (LFI/RCE)'"

# Linux process introspection paths abused by LFI (env leakage, log poisoning).
SecRule ARGS "@rx (?i)/proc/self/(environ|cmdline|fd)" \
    "id:9000032,phase:2,severity:ERROR,msg:'premium: /proc/self LFI target'"
