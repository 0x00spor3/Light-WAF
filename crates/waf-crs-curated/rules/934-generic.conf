# SPDX-License-Identifier: Apache-2.0
# Light WAF — curated premium ruleset: generic app attacks (SSRF / deserialization).

# SSRF to a cloud metadata endpoint (AWS/GCP/Azure) — high-signal, low false positive.
SecRule ARGS "@rx (?i)(169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.com)" \
    "id:9000050,phase:2,severity:CRITICAL,msg:'premium: SSRF to cloud metadata endpoint'"

# Serialized-object gadget markers (Java Runtime gadget, base64 Java stream header rO0AB…).
SecRule ARGS "@rx (?i)(java\.lang\.runtime|process\.getruntime|rO0AB)" \
    "id:9000051,phase:2,severity:CRITICAL,msg:'premium: deserialization gadget marker'"
