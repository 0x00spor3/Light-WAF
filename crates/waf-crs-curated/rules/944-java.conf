# Light WAF — curated premium ruleset: Java application attacks.

# Log4Shell (CVE-2021-44228): a JNDI lookup smuggled through a request header. High-signal and
# specific — exactly the kind of curated CVE signature that belongs in the premium tier.
SecRule REQUEST_HEADERS "@rx (?i)\$\{jndi:(ldap|ldaps|rmi|dns|iiop):" \
    "id:9000003,phase:2,severity:CRITICAL,msg:'premium: Log4Shell JNDI lookup (CVE-2021-44228)'"

# Log4Shell lookup-OBFUSCATION (E-1): the literal rule above is trivially bypassed by rebuilding
# `jndi`/the scheme through nested Log4j lookups — `${${lower:j}ndi:...}`, `${::-j}${::-n}${::-d}${::-i}:...`,
# `${env:X:-j}ndi:...`, `${jndi:${lower:l}dap://...}`. Match the obfuscation PRIMITIVES these all
# share and that are near-absent in benign input: a nested `${...${`, a Log4j lookup keyword
# (`${lower:`/`${env:`/...), or the empty-name default `${:-`/`${::-`. Scanned over the wider surface
# (URI/headers/args/cookies/body) since Log4Shell lands in any logged field; `t:urlDecodeUni` also
# catches the `%24%7B...` percent-encoded form. Benign `${var}` / `${price:-0}` templates stay clean.
SecRule REQUEST_URI|REQUEST_HEADERS|ARGS|REQUEST_COOKIES|REQUEST_BODY \
    "@rx (?i)\$\{(?:[^}]{0,60}\$\{|(?:lower|upper|env|sys|java|main|date|base64|k8s|spring|web|ctx|marker)\s*:|:{1,2}-)" \
    "id:9000004,phase:2,severity:CRITICAL,msg:'premium: Log4Shell JNDI lookup obfuscation (CVE-2021-44228)',t:urlDecodeUni"

# Spring4Shell (CVE-2022-22965): class-loader manipulation via crafted parameter names.
SecRule ARGS_NAMES "@rx (?i)class\.module\.classloader" \
    "id:9000060,phase:2,severity:CRITICAL,msg:'premium: Spring4Shell class loader manipulation (CVE-2022-22965)'"
