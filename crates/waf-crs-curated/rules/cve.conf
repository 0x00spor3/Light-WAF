# SPDX-License-Identifier: BUSL-1.1
# Light WAF — curated premium ruleset: named CVE signatures (CISA KEV / high-profile).
#
# Static, high-signal signatures for actively-exploited CVEs, expressed only in the v1 subset
# (@rx on supported targets). IDs live in the reserved 9100000+ range. Each has a bite-test in
# tests/gate.rs. Premium-additive; some overlap the native path-traversal / RCE baseline (accepted,
# paletto #4) but carry a CVE label for reporting.

# ── Tier 1: clean static signatures ────────────────────────────────────────────

# CVE-2026-48907 — Joomla JCE (com_jce) profiles.import RCE (CISA-cited, CVSS 10).
SecRule REQUEST_URI "@rx (?i)option=com_jce\b.{0,80}task=profiles\.import" \
    "id:9100001,phase:2,severity:CRITICAL,msg:'premium CVE-2026-48907: Joomla JCE profiles.import RCE'"

# CVE-2026-45247 — Mirasvit FPC Warmer (Magento) PHP object injection via CacheWarmer cookie.
SecRule REQUEST_COOKIES:CacheWarmer "@rx (?i)(O:[0-9]+:|a:[0-9]+:\{)" \
    "id:9100002,phase:2,severity:CRITICAL,msg:'premium CVE-2026-45247: Mirasvit CacheWarmer PHP object injection'"

# CVE-2026-34909 — Ubiquiti UniFi OS path traversal (CVSS 10).
SecRule REQUEST_URI "@rx (?i)/(api|proxy|manage)/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100003,phase:2,severity:ERROR,msg:'premium CVE-2026-34909: Ubiquiti UniFi OS path traversal'"

# CVE-2026-20262 — Cisco Catalyst SD-WAN Manager (vManage) path traversal (KEV Jun 2026).
SecRule REQUEST_URI "@rx (?i)/dataservice/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100004,phase:2,severity:ERROR,msg:'premium CVE-2026-20262: Cisco Catalyst SD-WAN Manager path traversal'"

# CVE-2025-2749 — Kentico Xperience Staging Sync Server access (KEV Apr 2026).
SecRule REQUEST_URI "@rx (?i)/staging/syncserver\.asmx" \
    "id:9100005,phase:1,severity:ERROR,msg:'premium CVE-2025-2749: Kentico Xperience Staging Sync access'"

# CVE-2025-29927 — Next.js middleware auth bypass: the internal header is never sent by a real client.
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^x-middleware-subrequest$" \
    "id:9100010,phase:1,severity:CRITICAL,msg:'premium CVE-2025-29927: Next.js middleware auth bypass header'"

# CVE-2025-64446 — FortiWeb auth bypass via encoded path traversal under /api/v2.0/.
SecRule REQUEST_URI "@rx (?i)/api/v2\.0/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100011,phase:2,severity:CRITICAL,msg:'premium CVE-2025-64446: FortiWeb auth bypass via path traversal'"

# CVE-2025-53770 — SharePoint "ToolShell" RCE: ToolPane.aspx with DisplayMode=Edit.
SecRule REQUEST_URI "@rx (?i)/_layouts/15/toolpane\.aspx\?.{0,120}displaymode=edit" \
    "id:9100012,phase:2,severity:CRITICAL,msg:'premium CVE-2025-53770: SharePoint ToolShell RCE'"

# CVE-2024-4577 — PHP-CGI argument injection (soft-hyphen %AD toward php.exe).
SecRule REQUEST_URI "@rx (?i)/php-cgi/php\.exe\?.{0,120}%ad" \
    "id:9100013,phase:2,severity:CRITICAL,msg:'premium CVE-2024-4577: PHP-CGI argument injection (soft hyphen)'"

# NB: CVE-2021-44228 (Log4Shell) is already covered by rule 9000003 in 944-java.conf.

# ── Tier 2: endpoint / header signatures ───────────────────────────────────────

# CVE-2024-27199 — JetBrains TeamCity path-traversal auth bypass (/res/.., /update/..).
SecRule REQUEST_URI "@rx (?i)/(res|update|jwt)/\.\.(%2f|/)" \
    "id:9100020,phase:1,severity:ERROR,msg:'premium CVE-2024-27199: JetBrains TeamCity path traversal auth bypass'"

# CVE-2023-27351 — PaperCut NG/MF SecurityRequestFilter auth bypass (SetupCompleted chain).
SecRule REQUEST_URI "@rx (?i)service=page/setupcompleted" \
    "id:9100021,phase:2,severity:ERROR,msg:'premium CVE-2023-27351: PaperCut NG/MF authentication bypass'"

# CVE-2025-31161 — Fortra GoAnywhere MFT license-servlet auth bypass.
SecRule REQUEST_URI "@rx (?i)/goanywhere/lic/accept" \
    "id:9100030,phase:1,severity:CRITICAL,msg:'premium CVE-2025-31161: Fortra GoAnywhere MFT license bypass'"

# CVE-2023-34362 — MOVEit Transfer SQLi / deserialization (MOVEITISAPI endpoint).
SecRule REQUEST_URI "@rx (?i)/moveitisapi/moveitisapi\.dll" \
    "id:9100031,phase:1,severity:CRITICAL,msg:'premium CVE-2023-34362: MOVEit Transfer SQLi/deserialization'"

# CVE-2024-3400 — PAN-OS GlobalProtect command injection via path traversal in the SESSID cookie.
SecRule REQUEST_COOKIES:SESSID "@rx (?i)\.\.(%2f|/)" \
    "id:9100032,phase:2,severity:CRITICAL,msg:'premium CVE-2024-3400: PAN-OS GlobalProtect command injection'"

# CVE-2025-61882 — Oracle E-Business Suite BI Publisher pre-auth RCE (Cl0p wave).
SecRule REQUEST_URI "@rx (?i)/oa_html/.{0,40}(syncservlet|xmlpserver|bipublisher)" \
    "id:9100033,phase:2,severity:ERROR,msg:'premium CVE-2025-61882: Oracle E-Business Suite BI Publisher RCE'"

# ── Deliberately OMITTED (would be false-positive cannons in the static subset) ─
# CVE-2026-28318 (SolarWinds Serv-U DoS): signature is "Content-Encoding: deflate" on POST — a
#   legitimate, extremely common header; matching it would block normal compressed traffic.
# CVE-2026-45659 (SharePoint deserialization, ToolShell family): only a bare "/_layouts/" endpoint,
#   used pervasively by legitimate SharePoint; the specific vector is already covered by 9100012.
