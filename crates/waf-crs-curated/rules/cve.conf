# SPDX-License-Identifier: Apache-2.0
# Light WAF — curated premium ruleset: named CVE signatures (CISA KEV / high-profile).
#
# Static, high-signal signatures for actively-exploited CVEs, expressed only in the v1 subset
# (@rx on supported targets). IDs live in the reserved 9100000+ range. Each has a bite-test in
# tests/gate.rs. Premium-additive; some overlap the native path-traversal / RCE baseline (accepted,
# paletto #4) but carry a CVE label for reporting.

# ── Tier 1: clean static signatures ────────────────────────────────────────────

# CVE-2026-48907 — Joomla JCE (com_jce) profiles.import RCE (CISA-cited, CVSS 10).
SecRule REQUEST_URI "@rx (?i)option=com_jce\b.{0,80}task=profiles\.import" \
    "id:9100001,phase:2,severity:CRITICAL,msg:'premium CVE-2026-48907: Joomla JCE profiles.import RCE'"

# CVE-2026-45247 — Mirasvit FPC Warmer (Magento) PHP object injection via CacheWarmer cookie.
SecRule REQUEST_COOKIES:CacheWarmer "@rx (?i)(O:[0-9]+:|a:[0-9]+:\{)" \
    "id:9100002,phase:2,severity:CRITICAL,msg:'premium CVE-2026-45247: Mirasvit CacheWarmer PHP object injection'"

# CVE-2026-34909 — Ubiquiti UniFi OS path traversal (CVSS 10).
SecRule REQUEST_URI "@rx (?i)/(api|proxy|manage)/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100003,phase:2,severity:ERROR,msg:'premium CVE-2026-34909: Ubiquiti UniFi OS path traversal'"

# CVE-2026-20262 — Cisco Catalyst SD-WAN Manager (vManage) path traversal (KEV Jun 2026).
SecRule REQUEST_URI "@rx (?i)/dataservice/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100004,phase:2,severity:ERROR,msg:'premium CVE-2026-20262: Cisco Catalyst SD-WAN Manager path traversal'"

# CVE-2025-2749 — Kentico Xperience Staging Sync Server access (KEV Apr 2026).
SecRule REQUEST_URI "@rx (?i)/staging/syncserver\.asmx" \
    "id:9100005,phase:1,severity:ERROR,msg:'premium CVE-2025-2749: Kentico Xperience Staging Sync access'"

# CVE-2025-29927 — Next.js middleware auth bypass: the internal header is never sent by a real client.
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^x-middleware-subrequest$" \
    "id:9100010,phase:1,severity:CRITICAL,msg:'premium CVE-2025-29927: Next.js middleware auth bypass header'"

# CVE-2025-64446 — FortiWeb auth bypass via encoded path traversal under /api/v2.0/.
SecRule REQUEST_URI "@rx (?i)/api/v2\.0/.{0,120}\.\.(%2f|%5c|/)" \
    "id:9100011,phase:2,severity:CRITICAL,msg:'premium CVE-2025-64446: FortiWeb auth bypass via path traversal'"

# CVE-2025-53770 — SharePoint "ToolShell" RCE: ToolPane.aspx with DisplayMode=Edit.
SecRule REQUEST_URI "@rx (?i)/_layouts/15/toolpane\.aspx\?.{0,120}displaymode=edit" \
    "id:9100012,phase:2,severity:CRITICAL,msg:'premium CVE-2025-53770: SharePoint ToolShell RCE'"

# CVE-2024-4577 — PHP-CGI argument injection (soft-hyphen %AD toward php.exe).
SecRule REQUEST_URI "@rx (?i)/php-cgi/php\.exe\?.{0,120}%ad" \
    "id:9100013,phase:2,severity:CRITICAL,msg:'premium CVE-2024-4577: PHP-CGI argument injection (soft hyphen)'"

# NB: CVE-2021-44228 (Log4Shell) is already covered by rule 9000003 in 944-java.conf.

# ── Tier 2: endpoint / header signatures ───────────────────────────────────────

# CVE-2024-27199 — JetBrains TeamCity path-traversal auth bypass (/res/.., /update/..).
SecRule REQUEST_URI "@rx (?i)/(res|update|jwt)/\.\.(%2f|/)" \
    "id:9100020,phase:1,severity:ERROR,msg:'premium CVE-2024-27199: JetBrains TeamCity path traversal auth bypass'"

# CVE-2023-27351 — PaperCut NG/MF SecurityRequestFilter auth bypass (SetupCompleted chain).
SecRule REQUEST_URI "@rx (?i)service=page/setupcompleted" \
    "id:9100021,phase:2,severity:ERROR,msg:'premium CVE-2023-27351: PaperCut NG/MF authentication bypass'"

# CVE-2025-31161 — Fortra GoAnywhere MFT license-servlet auth bypass.
SecRule REQUEST_URI "@rx (?i)/goanywhere/lic/accept" \
    "id:9100030,phase:1,severity:CRITICAL,msg:'premium CVE-2025-31161: Fortra GoAnywhere MFT license bypass'"

# CVE-2023-34362 — MOVEit Transfer SQLi / deserialization (MOVEITISAPI endpoint).
SecRule REQUEST_URI "@rx (?i)/moveitisapi/moveitisapi\.dll" \
    "id:9100031,phase:1,severity:CRITICAL,msg:'premium CVE-2023-34362: MOVEit Transfer SQLi/deserialization'"

# CVE-2024-3400 — PAN-OS GlobalProtect command injection via path traversal in the SESSID cookie.
SecRule REQUEST_COOKIES:SESSID "@rx (?i)\.\.(%2f|/)" \
    "id:9100032,phase:2,severity:CRITICAL,msg:'premium CVE-2024-3400: PAN-OS GlobalProtect command injection'"

# CVE-2025-61882 — Oracle E-Business Suite BI Publisher pre-auth RCE (Cl0p wave).
SecRule REQUEST_URI "@rx (?i)/oa_html/.{0,40}(syncservlet|xmlpserver|bipublisher)" \
    "id:9100033,phase:2,severity:ERROR,msg:'premium CVE-2025-61882: Oracle E-Business Suite BI Publisher RCE'"

# ── Tier 3: KEV / actively-exploited, Aug–Nov 2026 ─────────────────────────────

# CVE-2026-129448 — Apache Roller XML-RPC pre-auth deserialization (exploited Nov 2026). Apache
# XML-RPC's `serializable` extension type carries a Java object; no real blogging client sends it.
# Path-independent on purpose: the same primitive hits any Apache XML-RPC with extensions enabled.
SecRule REQUEST_BODY "@rx (?is)<\s*methodcall\b.*<\s*(?:[\w.-]+:)?serializable\b" \
    "id:9100040,phase:2,severity:CRITICAL,msg:'premium CVE-2026-129448: Apache XML-RPC serializable extension (Roller pre-auth RCE)'"

# CVE-2026-63077 — JetBrains TeamCity agent-protocol XStream deserialization (KEV Aug 2026).
# XStream gadget classes as XML elements / class= attributes (a stack trace mentions them only as
# text, without `<`), plus the `.jspws` file the public chain drops via HSQLDB.
SecRule REQUEST_FILENAME "@rx (?i)^/app/agents/" \
    "id:9100041,phase:2,chain,severity:CRITICAL,msg:'premium CVE-2026-63077: TeamCity agent XStream deserialization'"
    SecRule REQUEST_BODY "@rx (?i)(?:<|class\s*=\s*['\x22]?)\s*(?:java\.lang\.(?:ProcessBuilder|Runtime)|javax\.naming\.InitialContext|com\.sun\.rowset\.JdbcRowSetImpl|javax\.script\.ScriptEngineManager|java\.beans\.EventHandler|com\.sun\.org\.apache\.xalan\.internal\.xsltc\.trax\.TemplatesImpl|org\.apache\.commons\.collections\d*\.functors|org\.hsqldb\.|jdk\.nashorn\.|javax\.imageio\.ImageIO|dynamic-proxy)|\.jspws\b" \
        "t:none"

# CVE-2026-0768 — Langflow code-validator RCE (exploited Aug 2026, same endpoint as CVE-2025-3248).
# Python execution primitives in the code sent for validation. `os.environ` is deliberately not
# matched: legitimate custom components read their keys from the environment. A primitive must
# start a token — not follow `.` (`model.eval()` is PyTorch) — and a JSON-escaped line break
# (`\n`) counts as a token start, so `...\nexec(` at the beginning of a line is still caught.
SecRule REQUEST_FILENAME "@rx (?i)/api/v1/validate/code" \
    "id:9100042,phase:2,chain,severity:CRITICAL,msg:'premium CVE-2026-0768: Langflow validate/code RCE'"
    SecRule REQUEST_BODY "@rx (?i)__import__|(?:^|[^.\w]|\x5c[nrt])(?:subprocess\b|os\s*\.\s*(?:system|popen|exec[lv]|spawn)|pty\s*\.\s*spawn|(?:exec|eval)\s*\()" \
        "t:none"

# CVE-2026-87902 — WordPress core page-template LFI → RCE (KEV Sep 2026). Traversal in `pagename`,
# single- or double-encoded (ARGS decodes once, t:urlDecode once more). Stage 2 (pearcmd) is 9000033.
SecRule ARGS:pagename "@rx (?i)(?:\.\.|%2e%2e)(?:/|\x5c|%2f|%5c)" \
    "id:9100043,phase:2,severity:CRITICAL,msg:'premium CVE-2026-87902: WordPress pagename template traversal (LFI)',t:urlDecode"

# CVE-2026-75604 — Next.js on Windows: backslash traversal in route segments writes outside the
# ISR cache. A `..\` path segment (raw, %5c or double-encoded) is never legitimate. The `..` must
# start a segment or value, so an ellipsis in text (`Loading...\n`) stays clean.
SecRule REQUEST_URI "@rx (?i)(?:[/=&?\x5c]|%2f|%5c|%252f|%255c)(?:\.|%2e|%252e){2}(?:\x5c|%5c|%255c)" \
    "id:9100044,phase:2,severity:CRITICAL,msg:'premium CVE-2026-75604: Next.js Windows backslash path traversal'"

# CVE-2026-104935 — Ivanti Connect Secure auth bypass via a spoofed internal routing header
# (KEV Oct 2026, chained with CVE-2026-111357 to root). No real client sends this header.
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^x-dscgi-path$" \
    "id:9100045,phase:1,severity:CRITICAL,msg:'premium CVE-2026-104935: Ivanti Connect Secure X-DSCGI-PATH auth bypass'"

# CVE-2026-102895 — GPUStack < 2.2.0 treats a loopback client as admin and trusts its own
# client-IP header (KEV Nov 2026). A loopback value arriving from outside is a spoof.
SecRule REQUEST_HEADERS:X-GPUStack-Real-IP "@rx (?i)^\s*(?:127\.|\[?::1\]?\s*$|0:0:0:0:0:0:0:1|::ffff:127\.|localhost)" \
    "id:9100046,phase:1,severity:CRITICAL,msg:'premium CVE-2026-102895: GPUStack loopback client-IP spoof'"

# CVE-2026-49869 — Kestra OSS AuthenticationFilter exempts any path ENDING in /configs (KEV Sep
# 2026). The real public endpoint is /api/v1/configs; a resource route ending in `configs` is the
# bypass. Limited to the resources on the RCE path (run/create/update a flow), with at least one
# segment before `configs`, so generic `/api/v1/<x>/configs` REST APIs, a namespace or a KV key
# named `configs` stay clean. Residual FP: a flow whose id is literally `configs`.
SecRule REQUEST_FILENAME "@rx (?i)^/api/v1/(?:[^/]+/)?(?:executions|flows)[;/][^?]*[;/]configs/?$" \
    "id:9100047,phase:1,severity:CRITICAL,msg:'premium CVE-2026-49869: Kestra /configs-suffix auth bypass'"

# CVE-2026-96652 — Plex Media Server /player/timeline SSRF: a full URL in `protocol` (KEV Oct
# 2026, "Plex2Shell" chain). Legitimate clients send a bare scheme (`http`/`https`).
SecRule REQUEST_FILENAME "@rx (?i)/player/timeline" \
    "id:9100048,phase:2,chain,severity:CRITICAL,msg:'premium CVE-2026-96652: Plex /player/timeline SSRF'"
    SecRule ARGS:protocol "@rx (?i)^\s*[a-z][a-z0-9+.-]*:" \
        "t:none"

# CVE-2026-76504 — Cisco Catalyst SD-WAN Manager auth bypass through inconsistent URI decoding
# (KEV Sep 2026): the login servlet reached via a percent-encoded path (e.g. /%6a_security_check).
# Decode-then-match plus "the raw path had an escape", so every encoding variant is covered while
# the literal /j_security_check login stays clean.
SecRule REQUEST_FILENAME "@rx j_security_check" \
    "id:9100049,phase:1,chain,severity:CRITICAL,msg:'premium CVE-2026-76504: Cisco SD-WAN Manager encoded j_security_check bypass',t:urlDecode,t:lowercase"
    SecRule REQUEST_URI "@rx ^[^?]*%[0-9a-fA-F]{2}" \
        "t:none"

# CVE-2026-82329 — JFrog Access unauthenticated registry join mints an admin token (KEV Sep 2026).
# Only cluster peers call it; if peer traffic is routed through the WAF, exclude their addresses.
SecRule REQUEST_METHOD "@streq POST" \
    "id:9100050,phase:1,chain,severity:CRITICAL,msg:'premium CVE-2026-82329: JFrog Access registry join (admin token mint)'"
    SecRule REQUEST_FILENAME "@rx (?i)/access/api/v1/registry/join(?:/|$)" \
        "t:none"

# CVE-2026-5430 — WSO2 API Manager JWT validation fails open on an unsupported `alg` (KEV Sep
# 2026), e.g. `none`. Matches the base64url of `"alg":"none|None|NONE"` at all three alignments,
# so it is position-independent inside the JOSE header. Also a generic alg:none guard.
SecRule REQUEST_HEADERS:Authorization|REQUEST_HEADERS:X-JWT-Assertion "@rx ImFsZyI6Im5vbmUi|JhbGciOiJub25lI|iYWxnIjoibm9uZS|ImFsZyI6Ik5vbmUi|JhbGciOiJOb25lI|iYWxnIjoiTm9uZS|ImFsZyI6Ik5PTkUi|JhbGciOiJOT05FI|iYWxnIjoiTk9ORS" \
    "id:9100051,phase:1,severity:CRITICAL,msg:'premium CVE-2026-5430: JWT with alg none (WSO2 fail-open)'"

# ── Deliberately OMITTED (would be false-positive cannons in the static subset) ─
# CVE-2026-28318 (SolarWinds Serv-U DoS): signature is "Content-Encoding: deflate" on POST — a
#   legitimate, extremely common header; matching it would block normal compressed traffic.
# CVE-2026-45659 (SharePoint deserialization, ToolShell family): only a bare "/_layouts/" endpoint,
#   used pervasively by legitimate SharePoint; the specific vector is already covered by 9100012.
# Reviewed for the Aug–Nov 2026 KEV wave but NOT expressible as a static, low-FP request signature:
#   CVE-2026-71362 (Adobe Commerce session takeover), CVE-2026-65660 (SharePoint code injection),
#   CVE-2026-88779 (NetScaler SAML memory overflow), CVE-2026-59822 (LiteLLM MCP fabricated
#   Authorization), CVE-2026-83548/83549 (SonicWall SMA1000), CVE-2026-123218 (Aspera Faspex),
#   CVE-2026-115731 (Puppet, needs a signed agent cert / mTLS): no public request marker that a
#   legitimate request cannot also carry. CVE-2026-96655 (Plex transcoder SSRF): real clients
#   pass loopback URLs in `path`. CVE-2026-111357 (Ivanti) is local; its chain entry is 9100045.
#   CVE-2026-48710 (Starlette smuggling) is handled by the core smuggling guard, not by content.
