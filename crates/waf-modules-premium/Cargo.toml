[package]
name = "waf-modules-premium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Advanced detection modules for Light WAF: GraphQL and gRPC schema enforcement, OpenAPI positive security, bot detection."

[dependencies]
# The premium modules are injected via the core's `.add_module()` seam (BOUNDARY §4) — same
# `WafModule` contract, same cumulative anomaly score, zero core changes.
waf-core = { workspace = true }
# Reuse the OPEN GraphQL envelope-unwrapping so extraction mirrors the OPEN Phase-11 module.
waf-normalizer = { workspace = true }
# §4-B pt1: validate an executable document against the app's real schema. apollo-compiler is the
# Apollo Router's validator (zero-gap; a hand-rolled validator would be false security for a
# security control). Default-off, so its dep tree never touches the OPEN validation path.
apollo-compiler = "1"
# §4-B pt2 (gRPC): a DescriptorPool from the app's compiled FileDescriptorSet (.bin) + DynamicMessage
# decode of the protobuf request message against the RPC's input type.
prost-reflect = "0.14"
# §4-B pt3 (API Security): parse+structurally-validate the app's REAL OpenAPI spec. `oas3` covers 3.0
# AND 3.1; its default features are JSON-only — the optional `yaml-spec` feature pulls a c2rust-
# transpiled libyaml, deliberately NOT enabled (same no-C discipline as the SAML/xmlsec decision).
oas3 = "0.22"
# The spec is navigated + normalized as raw JSON so JSON-Schema fragments go straight to `jsonschema`
# (A3); serde_json is also the request-body parser for validation.
serde_json = "1"
jsonschema = { version = "0.47.0", default-features = false }

[dev-dependencies]
# The datapath bite-test runs the module through the REAL pipeline (blocks vs control).
waf-pipeline = { workspace = true }
# Test-only: compile an inline `.proto` to a FileDescriptorSet (no `protoc` binary needed), so the
# gRPC fixtures mirror the real flow (operator ships a `.bin` from protoc/buf).
protox = "0.7"
prost = "0.13"
