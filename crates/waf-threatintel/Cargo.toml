[package]
name = "waf-threatintel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Threat intelligence for Light WAF — cluster-wide IP-reputation WafModule (enterprise, BSL 1.1)"

[dependencies]
waf-core = { workspace = true }
# The ReputationStore seam + Reputation live with the Redis impl; this module consumes them.
waf-state-redis = { path = "../waf-state-redis" }
tracing = { workspace = true }

[dev-dependencies]
# Run the module through the real pipeline (bite-test: on the datapath, contributes to score).
waf-pipeline = { workspace = true }
waf-core = { workspace = true, features = ["testkit"] }
