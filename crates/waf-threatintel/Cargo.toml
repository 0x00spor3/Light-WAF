[package]
name = "waf-threatintel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Threat intelligence for Light WAF: reputation feeds and a cluster-wide IP-reputation detection module."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["waf", "security", "threat-intel", "ip-reputation", "redis"]
categories = ["web-programming", "network-programming"]

[dependencies]
waf-core = { workspace = true }
# The ReputationStore/ReputationWriter seams + Reputation live with the Redis impl; consumed here.
waf-state-redis = { path = "../waf-state-redis", version = "1.0.1" }
tracing = { workspace = true }
# Object-safe async trait for `dyn ReputationFeed` (feed sources).
async-trait = "0.1"
# The feed driver is a background task (spawn + periodic sleep).
tokio = { workspace = true, features = ["rt", "time"] }
# HTTP for the HttpListFeed. `rustls-no-provider` so reqwest does NOT pull its own crypto provider
# (no aws-lc-rs/cmake); the client supplies a `ring`-based rustls ClientConfig (the core's provider).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Public CA roots + the ring provider for the HTTPS client's rustls config (mirrors CloudflareDns).
webpki-roots = "1"
tokio-rustls = { workspace = true, features = ["ring"] }

[dev-dependencies]
# Run the module through the real pipeline (bite-test: on the datapath, contributes to score).
waf-pipeline = { workspace = true }
waf-core = { workspace = true, features = ["testkit"] }
# Async test runtime for the FileFeed/HttpListFeed unit tests.
tokio = { workspace = true, features = ["rt", "macros"] }
