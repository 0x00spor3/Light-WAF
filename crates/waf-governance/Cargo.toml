[package]
name = "waf-governance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Governance for the Light WAF control plane — RBAC, local auth, signed audit log (§8, enterprise, BSL 1.1)"

# Control-plane-only, like `waf-controlplane`: this is a LIBRARY the control plane links to add
# identities, roles, sessions and a tamper-evident audit log. It NEVER touches the datapath and does
# NOT depend on `waf-core` (zero-core, zero-datapath). It operates on the same Postgres (takes a
# `&PgPool`); it owns its own schema (`apply_schema`), the control plane owns the connection.
[dependencies]
serde = { workspace = true }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known"] }
thiserror = "2"
# Same async Postgres line as the control plane (pure-Rust, runtime queries → builds with no DB).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "time",
    "macros",
] }
# Ed25519 signatures + SHA-256 for the audit hash-chain (same `ring` the other enterprise crates use;
# no new crypto crate). Password hashing = argon2id (ring has no argon2).
ring = "0.17"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
