{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $pr := .Values.metrics.prometheusRule -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "waf.fullname" . }}
  labels:
    {{- include "waf.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: waf.rules
      rules:
        - alert: WafDown
          expr: waf_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "WAF instance is down"
            description: "waf_up is 0 for {{`{{ $labels.namespace }}/{{ $labels.pod }}`}} (WAF not serving)."
        - alert: WafInternalErrors
          expr: sum(rate(waf_requests_total{decision="internal_error"}[5m])) by (namespace, pod) > {{ $pr.internalErrorRate }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "WAF internal errors (possible bug)"
            description: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} is returning internal_error verdicts — the WAF's own machinery is failing, not the backend."
        - alert: WafUpstreamErrors
          expr: sum(rate(waf_requests_total{decision="upstream_error"}[5m])) by (namespace, pod) > {{ $pr.upstreamErrorRate }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WAF upstream errors elevated"
            description: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} upstream_error rate > {{ $pr.upstreamErrorRate }}/s — the backend is failing/timing out."
        - alert: WafHighBlockRatio
          expr: |-
            100 * sum(rate(waf_requests_total{decision="blocked"}[5m])) by (namespace, pod)
              / sum(rate(waf_requests_total[5m])) by (namespace, pod) > {{ $pr.blockRatioPercent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "WAF blocking a high share of traffic"
            description: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} blocked > {{ $pr.blockRatioPercent }}% of requests over 10m (attack, or a false-positive rule)."
        - alert: WafBadRequestSpike
          expr: sum(rate(waf_requests_total{decision="bad_request"}[5m])) by (namespace, pod) > {{ $pr.badRequestRate }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "WAF bad_request spike"
            description: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} bad_request rate > {{ $pr.badRequestRate }}/s (malformed/over-limit requests)."
        - alert: WafHighLatencyP99
          expr: |-
            histogram_quantile(0.99,
              sum(rate(waf_request_duration_seconds_bucket[5m])) by (le, namespace, pod)) > {{ $pr.latencyP99Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "WAF p99 latency high"
            description: "{{`{{ $labels.namespace }}/{{ $labels.pod }}`}} p99 request-handling latency > {{ $pr.latencyP99Seconds }}s over 10m."
{{- end }}
