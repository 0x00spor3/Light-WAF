# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: waf
description: >-
  Light WAF data plane (`waf-enterprise`) — a reverse-proxy Deployment that protects a single
  upstream Service ("WAF-per-workload"), with an optional rule-management agent sidecar.
type: application
# Chart version — bump on chart changes. appVersion tracks the enterprise image version.
version: 1.0.2
appVersion: "1.0.2"
keywords:
  - waf
  - security
  - reverse-proxy
home: https://lightwaf.org
icon: https://lightwaf.org/favicon.svg
sources:
  - https://github.com/0x00spor3/Light-WAF
maintainers:
  - name: 0x00spor3
    url: https://github.com/0x00spor3
annotations:
  category: Security
  # Artifact Hub (https://artifacthub.io). The image tags must equal appVersion: charts-release.yml
  # refuses to publish otherwise.
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://lightwaf.org/docs/kubernetes
    - name: Source
      url: https://github.com/0x00spor3/Light-WAF/tree/main/charts/waf
    - name: Security policy
      url: https://github.com/0x00spor3/Light-WAF/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: waf-enterprise
      image: ghcr.io/0x00spor3/waf-enterprise:1.0.2
    - name: waf-node-agent
      image: ghcr.io/0x00spor3/waf-node-agent:1.0.2
