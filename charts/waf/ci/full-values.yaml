# SPDX-License-Identifier: BUSL-1.1
# CI test values — exercises every optional path of the chart at once
# (agent sidecar + shared PID, TLS via cert-manager, shared Redis, OpenAPI schema,
# PodMonitor, HPA, PDB, private-registry image, http /healthz probes).
image:
  repository: registry.internal:5000/waf-enterprise
  tag: "0.1.0"

replicaCount: 3

waf:
  backend: "http://myapp.prod.svc.cluster.local:8080"
  mode: blocking
  paranoiaLevel: 3
  extraConfig: |
    # extra raw TOML
    [modules.graphql]
    enabled = true

metrics:
  enabled: true
  podMonitor:
    enabled: true
    labels:
      release: kube-prometheus
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus
    blockRatioPercent: 60
    latencyP99Seconds: 0.75
  grafanaDashboard:
    enabled: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  egressTo:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: myapp

rateLimit:
  enabled: true
  requests: 200

apiSchema:
  enabled: true
  specConfigMap: myapp-openapi

capture:
  enabled: true
  controlPlaneUrl: "http://waf-controlplane.waf.svc.cluster.local:9600"
  redaction:
    headers: [authorization, cookie, set-cookie]
    bodyFields: [password, token, secret]
  tokenSecret:
    name: waf-capture-token
    key: token

tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    dnsNames:
      - waf.example.com

agent:
  enabled: true
  image:
    repository: registry.internal:5000/waf-node-agent
  controlPlaneUrl: "http://waf-controlplane.waf.svc.cluster.local:9600"
  tokenSecret:
    name: waf-agent-token
    key: token

redis:
  urlSecret:
    name: waf-redis
    key: url

extraEnvFrom:
  - secretRef:
      name: waf-cloud-creds

service:
  exposeMetrics: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

probes:
  type: http

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: waf
