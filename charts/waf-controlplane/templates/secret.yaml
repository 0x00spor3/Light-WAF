{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- include "wafcp.resolveSecrets" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wafcp.fullname" . }}-env
  labels:
    {{- include "wafcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  WAF_CP_API_TOKEN: {{ required "secrets.apiToken is required" .Values.secrets.apiToken | quote }}
  WAF_CP_BOOTSTRAP_ADMIN_PASSWORD: {{ required "secrets.bootstrapAdminPassword is required" .Values.secrets.bootstrapAdminPassword | quote }}
  {{- if .Values.secrets.auditKey }}
  WAF_CP_AUDIT_KEY: {{ .Values.secrets.auditKey | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  WAF_CP_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.alertWebhook }}
  WAF_CP_ALERT_WEBHOOK: {{ .Values.secrets.alertWebhook | quote }}
  {{- end }}
  {{- /* DATABASE_URL lives in this Secret unless a dedicated database.existingSecret is used */ -}}
  {{- if not .Values.database.existingSecret }}
  WAF_CP_DATABASE_URL: {{ required "set postgres.bundled.enabled, database.url, or database.existingSecret" (include "wafcp.databaseUrl" .) | quote }}
  {{- end }}
{{- end }}
