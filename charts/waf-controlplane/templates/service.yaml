apiVersion: v1
kind: Service
metadata:
  name: {{ include "wafcp.fullname" . }}
  labels:
    {{- include "wafcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wafcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
