{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wafcp.fullname" . }}-config
  labels:
    {{- include "wafcp.labels" . | nindent 4 }}
data:
  controlplane.toml: |
    [controlplane]
    listen = {{ .Values.config.listen | quote }}
    retention_days = {{ .Values.config.retentionDays | int64 }}

    [controlplane.captures]
    retention_hours = {{ .Values.config.captures.retentionHours | int64 }}

    {{- range .Values.config.nodes }}

    [[controlplane.nodes]]
    name        = {{ .name | quote }}
    metrics_url = {{ .metricsUrl | quote }}
    {{- end }}

    [controlplane.alerting]
    enabled = {{ .Values.config.alerting.enabled }}
    eval_interval_seconds = {{ .Values.config.alerting.evalIntervalSeconds | int64 }}

    {{- range .Values.config.alerts }}

    [[controlplane.alerts]]
    name = {{ .name | quote }}
    decision = {{ .decision | quote }}
    group_by = {{ .groupBy | quote }}
    window_seconds = {{ .windowSeconds | int64 }}
    threshold = {{ .threshold | int64 }}
    severity = {{ .severity | quote }}
    cooldown_seconds = {{ .cooldownSeconds | int64 }}
    {{- end }}

    {{- if .Values.config.governance.enabled }}

    [controlplane.governance]
    enabled = true
    bootstrap_admin = {{ .Values.config.governance.bootstrapAdmin | quote }}
    {{- if .Values.config.governance.oidc.enabled }}

    [controlplane.governance.oidc]
    issuer_url = {{ .Values.config.governance.oidc.issuerUrl | quote }}
    client_id = {{ .Values.config.governance.oidc.clientId | quote }}
    redirect_url = {{ .Values.config.governance.oidc.redirectUrl | quote }}
    role_claim = {{ .Values.config.governance.oidc.roleClaim | quote }}
    {{- range .Values.config.governance.oidc.roleMap }}

    [[controlplane.governance.oidc.role_map]]
    claim = {{ .claim | quote }}
    role = {{ .role | quote }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if .Values.config.apiInventory.enabled }}

    [controlplane.api_inventory]
    spec_path = {{ .Values.config.apiInventory.mountPath | quote }}
    {{- end }}

    {{- with .Values.config.extraConfig }}

    {{ . | nindent 4 }}
    {{- end }}
