[proxy]
listen = "0.0.0.0:8080"
backend = "http://127.0.0.1:8000"

# TLS termination on the listener. DEFAULT OFF → the listener serves plaintext (h1 + h2c).
# With enabled = true the listener serves ONLY TLS (h1/h2 negotiated via ALPN); there is NO
# plaintext fallback on the same port. An unreadable cert with enabled = true is a FATAL error at
# boot (fail-closed, no downgrade). Certificates from files are part of the core; ACME, rotation
# and mTLS PKI come from waf-tls-managed (below) over the same TlsCertSource seam
# (BOUNDARY §3.2, ARCHITECTURE §9).
[tls]
enabled   = false
cert_path = "/etc/waf/tls/cert.pem"   # PEM chain (leaf first)
key_path  = "/etc/waf/tls/key.pem"    # PEM key (PKCS#8 / PKCS#1 / SEC1)
alpn      = ["h2", "http/1.1"]         # h2-ready (gRPC over TLS); h1-only clients fall back to http/1.1

# ── Managed TLS (waf-tls-managed) ────────────────────────────────────────────────
# Sub-tables read ONLY by waf-enterprise; the [tls] keys above still belong to waf_core::Config.
# Injected through the TlsCertSource seam (resolver() / client_verifier()) → no fork of the core.
#
# Managed ACME certificates (HITLESS rotation, the acceptor is not rebuilt). With enabled = true
# the certificate source is ACME → cert_path/key_path in [tls] are IGNORED. [tls].enabled still
# switches TLS on/off; with tls-alpn-01 the listener advertises the `acme-tls/1` ALPN for the
# challenge on the same port.
[tls.acme]
enabled       = false
domains       = ["waf.example.com"]      # certificate SANs (dns-01 supports wildcards "*.example.com")
email         = "ops@example.com"        # ACME account contact
strategy      = "tls-alpn-01"            # "tls-alpn-01" (default) | "dns-01" (wildcards, behind NAT)
cache_dir     = "acme-cache"             # account/cert persistence across restarts
staging       = true                      # true = staging CA (avoids Let's Encrypt production rate limits)
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"  # or a test Pebble
# provider      = "cloudflare"            # strategy = "dns-01" only: "cloudflare" | "route53"
# cluster       = false                    # MULTI-NODE (dns-01 only): true = nodes coordinate through
#                                          # Redis (SharedCertStore) → ONE node issues for the cluster,
#                                          # the others converge. Needs [enterprise].redis_url + the
#                                          # env `WAF_CERT_STORE_KEY` (encrypts the private key at rest).

# DNS-01 (strategy = "dns-01" only). Publishes the `_acme-challenge.<domain>` TXT record through
# the provider's API, then waits for it to propagate to the AUTHORITATIVE name servers before
# asking the CA to validate. Provider SECRETS are NOT here but in env vars:
#   - cloudflare → `CF_API_TOKEN`
#   - route53    → `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` (+ optional `AWS_SESSION_TOKEN`, `AWS_REGION`)
# The strategy is GLOBAL to the [tls.acme] block → ALPN and DNS-01 are mutually exclusive.
[tls.acme.dns]
zone_id                  = ""             # provider zone id (Cloudflare zone or Route53 hosted-zone id)
propagation_timeout_secs = 120            # max wait for the TXT to appear on the authoritative NS
poll_interval_secs       = 5
grace_secs               = 10             # courtesy delay after the first match (CAs use several vantage points)
renewal_days             = 60             # periodic renewal (LE certs last ~90 days)

# mTLS / managed PKI: requests and verifies the CLIENT certificate (client_verifier()).
# enabled = false ⇒ no client authentication, exactly like the core.
[tls.mtls]
enabled = false
ca_path = "/etc/waf/clients-ca.pem"      # PEM bundle of the trusted client CAs

[waf]
mode = "blocking"
block_threshold = 5
paranoia_level = 1          # 1..=4 — higher activates more (noisier) rules

# What to do when the WAF ITSELF is in trouble — an EXPLICIT policy per scenario.
# (The old waf.fail_open was removed: use this section.)
[resilience]
on_upstream_error   = "fail_closed"   # origin down/timeout -> 502 (closed) | 503 (open, retryable)
on_internal_error   = "fail_open"     # a panic/bug in a module must NOT take the site down
on_config_error     = "fail_open"     # invalid reload -> keep the last good config
on_parser_limit     = "fail_closed"   # normalization failed -> 400 (closed) | forward uninspected (open)
upstream_timeout_ms = 30000           # upstream round-trip cap (no hung workers)

# Point weight per severity class. Each matched rule contributes its severity's
# weight to the cumulative anomaly score; the request blocks at block_threshold.
# critical = 6 so a single high-confidence rule blocks on its own with a margin >= 1,
# while weak signals stay below the threshold (they only count when they accumulate).
# Matches the waf-core production default. Rationale: ARCHITECTURE §7.
[waf.severity_scores]
critical = 6
error    = 4
warning  = 3
notice   = 2

# L7 rate limiting (on_connection). Token bucket per key.
# key = "client_ip" is the client IP resolved by [network] below: behind a LB/CDN, set
# trusted_proxies, or every client shares the proxy's IP (one collective bucket).
[rate_limit]
enabled          = true
key              = "client_ip"
requests         = 100        # tokens per window
window_seconds   = 60
burst            = 100        # bucket capacity (default = requests)
action           = "block"    # "block" -> 429 | "score" -> adds to the anomaly score
score            = 5          # points when action = "score"
max_tracked_keys = 100000     # memory cap; a sweep evicts idle buckets

# SAFE client-IP resolution (shared by rate limiting, logging and IP reputation). The resolved
# IP is derived ONCE and stored in ctx.client_ip. Fail-safe: with trusted_proxies empty the XFF
# header is ALWAYS ignored and the peer address is used (an unconfigured deploy cannot be spoofed).
[network]
trusted_proxies  = []               # CIDRs of YOUR proxies/LBs/CDNs, e.g. ["10.0.0.0/8","::1"]
client_ip_header = "X-Forwarded-For"
trusted_hops     = 1                 # how many hops to trust, counting from the RIGHT (never the first IP)

[limits]
max_body_size    = 1048576   # 1 MiB
max_header_size  = 8192      # 8 KiB per header
max_headers      = 100
max_params       = 100
max_cookies      = 50
max_json_depth   = 20

[modules.sqli]
enabled = true

[modules.xss]
enabled = true

[modules.path_traversal]
enabled = true

[modules.rce]
enabled = true

[modules.lfi_rfi]
enabled = true

[modules.ssrf]
enabled = true

# ── signature modules (unambiguous signatures per attack category) ───────────────
[modules.ldap]
enabled = true

[modules.nosql]
enabled = true

[modules.mail]
enabled = true

[modules.ssti]
enabled = true

# Scanner/tool fingerprints on the User-Agent only (sqlmap/nuclei/… + OOB domains).
[modules.scanner]
enabled = true

# Server-Side Includes injection (<!--#exec|include|…).
[modules.ssi]
enabled = true

# XML External Entity (<!ENTITY / <!DOCTYPE…SYSTEM / encoding="UTF-7").
[modules.xxe]
enabled = true

[modules.header_injection]
enabled = true

# HTTP FRAMING validation (CL/TE) — a structural check, NOT content inspection.
# Default true: very low false-positive rate (fires only on illegal/ambiguous framing).
[modules.request_smuggling]
enabled = true

# STRUCTURAL GraphQL protections — like request_smuggling, NOT content inspection: DoS/abuse caps
# on the SHAPE of the GraphQL operation (depth/aliases/fields/directives/batch) plus an
# introspection policy, via a lexical parse. DEFAULT OFF: endpoint-specific, the caps must be
# tuned per app. Inspects JSON `query` / GET `?query=` only on `paths`, and every
# `application/graphql` body.
[modules.graphql]
enabled             = false
paths               = ["/graphql"]
max_depth           = 15            # max selection-set nesting (paren-aware)
max_aliases         = 30            # alias-bomb cap
max_fields          = 1000          # complexity proxy (number of selections)
max_directives      = 50
max_batch           = 10            # max operations in one batched request
block_introspection = false         # block __schema/__type → 403

# STRUCTURAL gRPC protections — like graphql, NOT content inspection: the CONTENT of protobuf
# fields is inspected by the regular modules (de-framing + leaf extraction); this module applies
# DoS caps on the SHAPE of the message plus a policy for compressed payloads. DEFAULT OFF:
# endpoint-specific, caps to be tuned. Matches application/grpc*.
# Note: gRPC runs over HTTP/2, which is ALWAYS served (h2c in plaintext, or h2 over TLS when
# [tls] is on). The gRPC module does NOT require TLS: the two settings are independent.
[modules.grpc]
enabled           = false
max_message_bytes = 4194304          # 4 MiB — cap on the total inspectable payload size
max_fields        = 4096             # field-bomb cap
max_depth         = 16               # depth-bomb cap (sub-message nesting)
on_compressed     = "reject"         # a compressed payload is opaque: "reject" (fail-closed) | "passthrough"

[modules.crs]
enabled = true
files   = ["test.conf"]

# ── Distributed StateStore on Redis (waf-state-redis) ────────────────────────────
# Cluster-wide rate limiting: the WAF nodes share ONE budget through Redis (atomic server-side
# try_acquire), injected through the StateStore seam. Absent ⇒ single-node in-memory store.
[enterprise]
redis_url = "redis://10.0.0.5:6379"   # Redis connection; overridden by the env WAF_REDIS_URL (env wins)
pool_size = 32                         # connection pool size
fail_open = true                       # Redis error at RUNTIME: true = allow (fail-open) | false = deny.
                                       # Redis unreachable at BOOT is always fatal (regardless)

# ── Cluster-wide IP reputation (waf-threatintel) ─────────────────────────────────
# A Phase::Connection module that reads the client IP's reputation from the SAME Redis (keyspace
# `rep:<ip>`, filled by the threat-intel feed below) and adds to the SAME cumulative anomaly score
# (severity → points from the pipeline, no hard-coded scores). NEEDS redis_url. On failure →
# Unknown (feed down = no opinion, the pipeline still inspects). DEFAULT OFF. The severity decides
# whether a "malicious" IP alone crosses block_threshold.
[enterprise.reputation]
enabled            = false
malicious_severity = "critical"        # critical | error | warning | notice
suspicious_severity = "warning"

# ── Threat-intel feed that FILLS the reputation store (waf-threatintel) ──────────
# A background task that downloads IP lists and writes `rep:<ip>` into the SAME Redis (what the
# reputation module above reads). SINGLE WRITER: only ONE node writes per cycle (distributed
# lock), so N nodes do not repeat the same fetch. NEEDS redis_url. DEFAULT OFF.
# TTL semantics: entries expire (entry_ttl); a de-listed IP ages out on its own, a feed that is
# down lets everything expire → Unknown (fail-safe). The verdict is PER SOURCE (the content says
# WHICH IPs, never HOW bad). CIDR entries are not supported yet (skipped with a warning; exact IPs only).
[enterprise.reputation.feed]
enabled              = false
refresh_interval_secs = 300            # seconds between one cycle and the next
# entry_ttl_secs     = 900             # TTL of each entry; absent ⇒ 3× refresh (a safe window)
lock_ttl_secs        = 90              # TTL of the per-cycle single-writer lock (~ worst-case fetch+write)

# Sources (0..N). kind = "file" (local path) | "http" (HTTPS URL). verdict = malicious | suspicious.
# [[enterprise.reputation.feed.sources]]
# kind     = "http"
# location = "https://example.com/blocklist.txt"
# verdict  = "malicious"
#
# [[enterprise.reputation.feed.sources]]
# kind     = "file"
# location = "/etc/waf/greylist.txt"
# verdict  = "suspicious"

# ── Curated CRS ruleset (waf-crs-curated) ────────────────────────────────────────
# Loads the curated CRS content (CVE/app/evasion signatures: Log4Shell, Spring4Shell, SSRF to
# cloud metadata, webshells, .git/.env exposure, …) as a WafModule through the core's CRS engine.
# ADDITIVE to the native modules (it counts in the SAME cumulative score → with CRS on, tuning the
# threshold is up to the operator). No Redis. DEFAULT OFF.
[enterprise.crs_curated]
enabled = false

# ── GraphQL schema enforcement (waf-schema-enforcement) ──────────────────────────
# Validates EVERY GraphQL operation against the app's REAL SCHEMA (an SDL .graphql file): a
# field/type/argument NOT in the schema = a query the real client never sends = a probing signal →
# adds to the SAME cumulative score (schema governance, NOT baseline detection; injection in values
# is still the regular modules' job, DoS caps the core GraphQL module's). Additive, no Redis.
# DEFAULT OFF. schema_path is REQUIRED when enabled (boot-fatal if missing/invalid). No hot reload
# of the schema yet (schema drift → restart).
[enterprise.schema_enforcement]
enabled = false
# schema_path = "/etc/waf/app.graphql"     # the app's SDL file (required when enabled)
# paths = ["/graphql"]                       # GraphQL endpoints gated for JSON/GET (application/graphql = any path)
# parse_error_severity = "warning"           # non-GraphQL body (broken client / generic probing)
# unknown_field_severity = "critical"        # valid query but outside the schema (targeted probing)

# ── gRPC schema enforcement (waf-schema-enforcement) ─────────────────────────────
# Validates EVERY gRPC (protobuf) message against the app's REAL DESCRIPTOR (a FileDescriptorSet
# .bin from `protoc` / `buf build -o app.bin`): the `:path` (/pkg.Service/Method) selects the input
# type and the message is decoded against it. Unknown method or undecodable message = probing →
# SAME cumulative score. Recognized by Content-Type application/grpc* (no paths). Additive, no
# Redis. DEFAULT OFF. descriptor_path REQUIRED when enabled (boot-fatal if missing/invalid). Unary
# only; no hot reload yet (drift → restart). Note: protobuf tolerates unknown fields by design →
# flag_unknown_fields is OPT-IN (default off), so a client using a newer .proto than the WAF's copy
# does not cause false positives.
[enterprise.grpc_schema_enforcement]
enabled = false
# descriptor_path = "/etc/waf/app.bin"       # compiled FileDescriptorSet (required when enabled)
# flag_unknown_fields = false                 # opt-in: flag fields outside the descriptor (top level)
# unknown_method_severity = "critical"        # :path not in the descriptor (targeted probing)
# decode_error_severity  = "warning"          # message that does not decode (malformed)
# unknown_field_severity = "notice"           # used only with flag_unknown_fields

# ── OpenAPI positive security (waf-schema-enforcement) ───────────────────────────
# Validates EVERY REST/JSON request under the `paths` prefixes against the app's REAL OPENAPI SPEC
# (3.0/3.1, JSON file). Routing uses the NORMALIZED path (decoded, traversal resolved → resistant
# to evasion); requests outside `paths` are untouched. Two families of signals, additive to the
# SAME cumulative score: undeclared route/method (`schema-api-unknown-route` /
# `-method-not-allowed`, unknown_route_severity) and contract violations on a known operation
# (unknown/missing/wrongly-typed parameter, unexpected body property, content type, unparseable
# body → violation_severity). Injection in a parameter's VALUE is still the core modules' job.
# No Redis. DEFAULT OFF. spec_path REQUIRED when enabled (boot-fatal if missing/invalid/not
# compilable); recompiled on every reload (a spec that became invalid → the reload is aborted, the
# previous one stays). Remote $refs are never fetched. With the default scores (warning = 3,
# critical = 6, threshold 5) a single violation does not block, two different ones do, and an
# unknown route blocks on its own.
[enterprise.api_schema]
enabled = false
# spec_path = "/etc/waf/openapi.json"        # the app's OpenAPI spec, JSON (required when enabled)
# paths = ["/api"]                           # protected path prefixes (default ["/api"])
# unknown_route_severity = "critical"        # undeclared path or method (targeted probing)
# violation_severity = "warning"             # contract violation on a declared operation
# strict_params = true                       # flag query params not declared for the operation
# strict_body = true                         # treat the body as additionalProperties: false even if
#                                            # the spec does not say so

# ── Client integrity / bot detection (waf-schema-enforcement) ────────────────────
# NATIVE cross-header heuristics (not UA-tool matching, which is the core `scanner` module, nor
# content signatures, which is curated CRS). Currently browser impersonation: a UA claiming a
# MODERN browser (Chrome/Edge/Firefox with a 3-digit version; Safari excluded) but with NO
# `sec-fetch-*` header = a client posing as a browser (a bot using curl/requests sends no Fetch
# Metadata). Non-browser clients (curl/SDKs) do not claim a browser → they do not trigger it.
# Additive (scores), never Reject. No files, no Redis. DEFAULT OFF. False-positive sources: old or
# unusual browsers, or proxies that strip headers → tune with the severity.
[enterprise.bot_detection]
enabled = false
# browser_impersonation_severity = "critical"   # modern browser UA without Sec-Fetch-*

# ── Signed WASM plugin loader (waf-wasm-signing) ─────────────────────────────────
# The Proxy-Wasm runtime is in the core (`[modules.wasm]`, loads UNSIGNED .wasm, skip-on-error).
# This adds the TRUST GATE: a DETACHED minisign (ed25519) signature of the .wasm is verified against
# `trusted_keys` BEFORE loading it. A signed plugin that does NOT verify = BOOT-FATAL (fail-closed;
# a different stance from the core: a signature that does not verify is indistinguishable from
# tampering). DEFAULT OFF. `exclusive = true` = refuse at boot a config whose core `[modules.wasm]`
# is populated (the lockdown is enforced, not a convention). Signing: `minisign -Sm plugin.wasm` →
# plugin.wasm.minisig; the key to put in trusted_keys is the base64 LINE of the .pub file.
[enterprise.wasm]
enabled = false
# exclusive = false                              # true = forbid unsigned core plugins
# trusted_keys = ["RWQ...base64-minisign-pubkey..."]
# pool_size = 4
# fuel_per_request = 10000000
# max_memory_bytes = 16777216
# checkout_timeout_ms = 100
# [[enterprise.wasm.plugins]]
# wasm_path = "/etc/waf/denylist.wasm"
# sig_path  = "/etc/waf/denylist.wasm.minisig"
# config    = "block=/admin"
