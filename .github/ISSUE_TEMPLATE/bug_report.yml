name: Bug report
description: Something does not work as documented (crash, wrong config handling, broken chart, dashboard error).
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A request that is **blocked but should pass** is a false positive — use that template instead.
        A request that **passes but should be blocked** is a detection bypass — report it privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal config (redact secrets), commands, and the request if relevant.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (`RUST_LOG=debug` helps). Redact tokens and client data.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate version, image tag or chart version (e.g. 1.0.2).
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - WAF proxy / detection (core)
        - Control plane / dashboard
        - Governance (users, SSO, audit)
        - Helm chart / operator
        - TLS / ACME
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: How you run it (binary, Docker, Kubernetes version) and the OS / architecture.
