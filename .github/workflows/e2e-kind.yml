name: E2E (kind)

# K6 of the Kubernetes-native deployment plan. Spins up a kind cluster, builds+loads the
# images (no registry), deploys the control plane + a test app + the WAF + the log shipper,
# then drives a SQLi and asserts the WAF blocks it (403) AND the event reaches the control
# plane. Heavy (builds Rust images) → runs on demand and on main, not every PR.

on:
  push:
    branches: [main, master]
    paths:
      - "charts/**"
      - "deploy/**"
      - "scripts/k8s/**"
      - "Dockerfile.enterprise"
      - "Dockerfile.controlplane"
      - "crates/**"
      - ".github/workflows/e2e-kind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Install kind
        run: |
          curl -fsSLo ./kind \
            https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          # From the release's kind-linux-amd64.sha256sum; bump it together with the version.
          echo "b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  ./kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Make scripts executable
        run: chmod +x scripts/k8s/*.sh scripts/images/*.sh

      - name: Run e2e
        run: bash scripts/k8s/e2e-kind.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n waf describe deploy app-waf || true
          kubectl -n waf logs -l app.kubernetes.io/name=waf --tail=100 || true
          kubectl -n waf-system logs -l app.kubernetes.io/name=waf-log-shipper --tail=100 || true
