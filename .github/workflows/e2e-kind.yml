name: E2E (kind)

# K6 of the Kubernetes-native deployment plan. Spins up a kind cluster, builds+loads the
# images (no registry), deploys the control plane + a test app + the WAF + the log shipper,
# then drives a SQLi and asserts the WAF blocks it (403) AND the event reaches the control
# plane. Heavy (builds Rust images) → runs on demand and on main, not every PR.

on:
  push:
    branches: [main, master]
    paths:
      - "charts/**"
      - "deploy/**"
      - "scripts/k8s/**"
      - "Dockerfile.enterprise"
      - "Dockerfile.controlplane"
      - "crates/**"
      - ".github/workflows/e2e-kind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install kind
        run: |
          curl -fsSLo ./kind \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          # From the release's kind-linux-amd64.sha256sum; bump it together with the version. Its
          # default node is Kubernetes 1.37 (the operator's k8s-openapi supports 1.32 onward).
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  ./kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Make scripts executable
        run: chmod +x scripts/k8s/*.sh scripts/images/*.sh

      - name: Run e2e
        run: bash scripts/k8s/e2e-kind.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n waf describe deploy app-waf || true
          kubectl -n waf logs -l app.kubernetes.io/name=waf --tail=100 || true
          kubectl -n waf-system logs -l app.kubernetes.io/name=waf-log-shipper --tail=100 || true
