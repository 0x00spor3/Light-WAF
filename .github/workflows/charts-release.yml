name: Charts release

# Publishes the Helm charts as OCI artifacts on GHCR for a release, so they install without a
# checkout:
#
#   helm install myapp-waf oci://ghcr.io/<owner>/charts/waf --version <version>
#
# Same trigger as the image publish (images.yml): a pushed `v*` tag, or a manual run with
# `release_tag` for a tag that already exists. Every chart is linted first; its version, appVersion
# and Artifact Hub image tags must all equal the release version. The pushed chart is signed with
# cosign (keyless, like the images).
#
# Artifact Hub: each chart is its own Artifact Hub repository (oci://ghcr.io/<owner>/charts/<chart>).
# Once it is registered there, store the repository ID Artifact Hub shows in the repository
# variable ARTIFACTHUB_REPO_ID_WAF / ARTIFACTHUB_REPO_ID_WAF_CONTROLPLANE: the next release then
# also pushes the `artifacthub.io` metadata tag that makes it a verified publisher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the charts of this EXISTING release tag (e.g. v1.0.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: charts-release-${{ inputs.release_tag || github.ref_name }}

jobs:
  publish:
    name: publish (${{ matrix.chart }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/charts
      id-token: write   # keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: waf
            artifacthub_var: ARTIFACTHUB_REPO_ID_WAF
          - chart: waf-controlplane
            artifacthub_var: ARTIFACTHUB_REPO_ID_WAF_CONTROLPLANE
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      CHART: ${{ matrix.chart }}
      OCI_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Check the versions
        id: ver
        run: |
          version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match the workspace version $version"
            exit 1
          fi
          chart_file="charts/$CHART/Chart.yaml"
          chart_version=$(sed -n 's/^version: *//p' "$chart_file")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "$chart_file")
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::$chart_file has version $chart_version / appVersion $app_version, expected $version"
            exit 1
          fi
          # Every image Artifact Hub lists must be the release's.
          if grep -E '^\s+image: ' "$chart_file" | grep -v ":$version\$"; then
            echo "::error::$chart_file lists an artifacthub.io/images tag other than $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint and package
        run: |
          helm lint "charts/$CHART"
          helm package "charts/$CHART" -d dist

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          # cosign and oras read the Docker credentials.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push
        id: push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm push "dist/$CHART-$VERSION.tgz" "oci://$OCI_REPO" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          if [ -z "$digest" ]; then echo "::error::no digest in the helm push output"; exit 1; fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign
        env:
          REF: ${{ env.OCI_REPO }}/${{ matrix.chart }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: vars[matrix.artifacthub_var] != ''

      - name: Artifact Hub metadata
        if: vars[matrix.artifacthub_var] != ''
        env:
          REPOSITORY_ID: ${{ vars[matrix.artifacthub_var] }}
        run: |
          printf 'repositoryID: %s\n' "$REPOSITORY_ID" > artifacthub-repo.yml
          oras push "$OCI_REPO/$CHART:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
