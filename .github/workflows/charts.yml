name: Charts (lint + kubeconform)

# K2/K3 of the Kubernetes-native deployment plan. Lints the Helm charts and validates
# the rendered manifests (default + CI values) against the Kubernetes + CRD schemas.
# Pure static validation — no cluster, no push.

on:
  push:
    branches: [main, master]
    paths:
      - "charts/**"
      - ".github/workflows/charts.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-template:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [waf, waf-controlplane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          # From the release's CHECKSUMS file; bump it together with the version.
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform

      - name: helm lint (default)
        run: helm lint charts/${{ matrix.chart }}

      - name: helm lint (CI values)
        run: |
          for f in charts/${{ matrix.chart }}/ci/*.yaml; do
            [ -e "$f" ] || continue
            echo "== lint -f $f =="
            helm lint charts/${{ matrix.chart }} -f "$f"
          done

      - name: kubeconform (default + CI values)
        env:
          # Kubernetes core schemas + the datree CRD catalog (PodMonitor, Certificate, …).
          CRD: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
        run: |
          set -euo pipefail
          # validate <label> [helm template args…]
          validate() {
            echo "== kubeconform: $1 =="
            shift
            helm template rel charts/${{ matrix.chart }} "$@" \
              | kubeconform -strict -summary \
                  -schema-location default -schema-location "$CRD"
          }
          validate default
          for f in charts/${{ matrix.chart }}/ci/*.yaml; do
            [ -e "$f" ] || continue
            validate "$(basename "$f")" -f "$f"
          done
