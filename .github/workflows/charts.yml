name: Charts (lint + kubeconform)

# K2/K3 of the Kubernetes-native deployment plan. Lints the Helm charts and validates
# the rendered manifests (default + CI values) against the Kubernetes + CRD schemas.
# Pure static validation — no cluster, no push.

on:
  push:
    branches: [main, master]
    paths:
      - "charts/**"
      - "Cargo.toml"
      - ".github/workflows/charts.yml"
  pull_request:
    paths:
      - "charts/**"
      - "Cargo.toml"
      - ".github/workflows/charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-template:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [waf, waf-controlplane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          # From the release's CHECKSUMS file; bump it together with the version.
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform

      # The same check charts-release.yml makes before publishing — caught here, a forgotten bump
      # fails the PR instead of the release.
      - name: Versions match the workspace
        env:
          CHART: ${{ matrix.chart }}
        run: |
          version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)
          chart_file="charts/$CHART/Chart.yaml"
          chart_version=$(sed -n 's/^version: *//p' "$chart_file")
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "$chart_file")
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::$chart_file has version $chart_version / appVersion $app_version, the workspace $version"
            exit 1
          fi
          if grep -E '^\s+image: ' "$chart_file" | grep -v ":$version\$"; then
            echo "::error::$chart_file lists an artifacthub.io/images tag other than $version"
            exit 1
          fi

      - name: helm lint (default)
        run: helm lint charts/${{ matrix.chart }}

      - name: helm lint (CI values)
        run: |
          for f in charts/${{ matrix.chart }}/ci/*.yaml; do
            [ -e "$f" ] || continue
            echo "== lint -f $f =="
            helm lint charts/${{ matrix.chart }} -f "$f"
          done

      - name: kubeconform (default + CI values)
        env:
          # Kubernetes core schemas + the datree CRD catalog (PodMonitor, Certificate, …).
          CRD: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
        run: |
          set -euo pipefail
          # validate <label> [helm template args…]
          validate() {
            echo "== kubeconform: $1 =="
            shift
            helm template rel charts/${{ matrix.chart }} "$@" \
              | kubeconform -strict -summary \
                  -schema-location default -schema-location "$CRD"
          }
          validate default
          for f in charts/${{ matrix.chart }}/ci/*.yaml; do
            [ -e "$f" ] || continue
            validate "$(basename "$f")" -f "$f"
          done
