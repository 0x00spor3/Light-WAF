name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned dependencies, token
# permissions, branch protection, signed releases, …). The results are published to the public
# Scorecard API — that is what the README badge shows — and uploaded to code scanning, where each
# finding links to the remediation.
#
# publish_results imposes restrictions on this workflow (no top-level env or defaults, no
# containers or services, only allowed actions): keep it minimal.

on:
  push:
    branches: [main]
  # Branch-protection changes are part of the score.
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 2"   # Tuesdays 06:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results: prove the results come from this workflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
