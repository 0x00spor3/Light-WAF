name: Images (build + SBOM + scan)

# K1 of the Kubernetes-native deployment plan. Builds the three enterprise images,
# generates an SBOM, and runs a vulnerability scan as a GATE (fails on HIGH/CRITICAL).
#
# POLICY: this workflow NEVER pushes to a registry — it only builds and verifies.
# Publishing (to a private registry) is a deliberate, manual operator action outside CI.
# There is intentionally no docker/login or push step anywhere below.

on:
  push:
    tags: ["v*"]
    paths:
      - "Dockerfile.*"
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "Dockerfile.*"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── amd64 build + supply-chain gate (SBOM + vuln scan) ────────────────────────
  scan:
    name: build + scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: waf-enterprise
            dockerfile: Dockerfile.enterprise
          - image: waf-node-agent
            dockerfile: Dockerfile.node-agent
          - image: waf-controlplane
            dockerfile: Dockerfile.controlplane
          - image: waf-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false           # POLICY: never push
          tags: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: SBOM (syft → SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          format: spdx-json
          output-file: "${{ matrix.image }}-${{ steps.ver.outputs.version }}.spdx.json"

      - name: Vulnerability scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: "${{ matrix.image }}-*.spdx.json"
          if-no-files-found: ignore

  # ── multi-arch build validation (amd64 + arm64), no registry, no load ─────────
  multiarch:
    name: multiarch build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: waf-enterprise
            dockerfile: Dockerfile.enterprise
          - image: waf-node-agent
            dockerfile: Dockerfile.node-agent
          - image: waf-controlplane
            dockerfile: Dockerfile.controlplane
          - image: waf-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64+arm64 (validate both arches — no push, no load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false           # POLICY: never push — build-only validation
          tags: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
