name: Images (build + SBOM + scan + publish)

# Builds the four container images, generates an SBOM, and runs a vulnerability scan as a
# GATE (fails on HIGH/CRITICAL).
#
# PUBLISHING: only a release publishes. Pushing a `v*` tag — or running this workflow by
# hand with `release_tag` set (for a tag that already exists) — pushes multi-arch images
# (amd64 + arm64) to ghcr.io/<owner>/<image>, and ONLY after every image passed the scan
# gate. Pull requests, plain manual runs and the weekly re-scan build and verify only;
# they never log in to a registry.

on:
  push:
    # Path filters are not evaluated for tag pushes: every `v*` tag runs (and publishes).
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile.*"
      - ".github/workflows/images.yml"
      - ".trivyignore"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the images for this EXISTING release tag (e.g. v1.0.0). Leave empty to build and scan only."
        required: false
        default: ""
  # Weekly re-scan: CVEs are disclosed against already-shipped packages over time,
  # so even with digest-pinned bases an unchanged image can turn red. This rebuilds
  # (amd64 only — see the multiarch job's `if`) and re-runs the vuln gate against a
  # fresh trivy DB. A failure here means a new CVE landed → bump the base digest to a
  # patched distroless, or add a justified `.trivyignore` entry.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}-${{ inputs.release_tag || '' }}
  # Only superseded PR runs are cancelled — never a release that is publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── amd64 build + supply-chain gate (SBOM + vuln scan) ────────────────────────
  scan:
    name: build + scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: waf-enterprise
            dockerfile: Dockerfile.enterprise
          - image: waf-node-agent
            dockerfile: Dockerfile.node-agent
          - image: waf-controlplane
            dockerfile: Dockerfile.controlplane
          - image: waf-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual publish run scans the tagged commit, not the branch it was started from.
          ref: ${{ inputs.release_tag }}

      - name: Derive version
        id: ver
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false           # the scan gate never pushes; see the publish job
          tags: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: SBOM (syft → SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          format: spdx-json
          output-file: "${{ matrix.image }}-${{ steps.ver.outputs.version }}.spdx.json"

      # Gate on ALL HIGH/CRITICAL — fixed OR unfixed. Unfixed base-OS CVEs are NOT
      # silently tolerated: we engineer them away (distroless keeps the OS surface
      # tiny) or accept them EXPLICITLY via a justified `.trivyignore` entry. This
      # matches scripts/images/sbom-scan.sh (no --ignore-unfixed); keeping the two
      # gates aligned is the point — `ignore-unfixed: true` here would have passed
      # green on the 103 unfixed base CVEs that drove the distroless rebase.
      - name: Vulnerability scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: "${{ matrix.image }}-*.spdx.json"
          if-no-files-found: ignore

  # ── multi-arch build validation (amd64 + arm64), no registry, no load ─────────
  multiarch:
    name: multiarch build (${{ matrix.image }})
    runs-on: ubuntu-latest
    # The weekly re-scan only needs the amd64 build+gate above; skip the (heavier)
    # multi-arch validation on scheduled runs. A release skips it too: the publish job
    # below builds the same two architectures and pushes them.
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) &&
      (inputs.release_tag || '') == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: waf-enterprise
            dockerfile: Dockerfile.enterprise
          - image: waf-node-agent
            dockerfile: Dockerfile.node-agent
          - image: waf-controlplane
            dockerfile: Dockerfile.controlplane
          - image: waf-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64+arm64 (validate both arches — no push, no load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false           # build-only validation
          tags: ${{ matrix.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}

  # ── release: push multi-arch images to GHCR, after the scan gate ──────────────
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    # `needs: scan` is the gate: one image failing the vuln scan publishes none of them.
    needs: scan
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.release_tag || '') != '')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: waf-enterprise
            dockerfile: Dockerfile.enterprise
          - image: waf-node-agent
            dockerfile: Dockerfile.node-agent
          - image: waf-controlplane
            dockerfile: Dockerfile.controlplane
          - image: waf-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Derive version and tags
        id: ver
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -n1)
          # The tag must match the workspace version — never publish 1.0.0 under v1.0.1.
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match the workspace version $version"
            exit 1
          fi
          tags="$IMAGE:$version"
          # A stable release also moves the `X.Y` and `latest` tags; a pre-release (1.1.0-rc.1) does not.
          case "$version" in
            *-*) ;;
            *) tags="$tags,$IMAGE:${version%.*},$IMAGE:latest" ;;
          esac
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64+arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ steps.ver.outputs.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
