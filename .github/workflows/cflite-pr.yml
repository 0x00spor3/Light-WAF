name: Fuzzing (PR)

# ClusterFuzzLite on pull requests: builds the cargo-fuzz targets in fuzz/ with AddressSanitizer
# (.clusterfuzzlite/) and fuzzes for a few minutes, focused on the code the PR changes. A crash fails
# the check and the reproducer is attached to the run. It also keeps the fuzz targets compiling —
# fuzz/ is not a workspace member, so `cargo test` does not build it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
