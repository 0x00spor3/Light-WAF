name: E2E (control-plane UI)

# Playwright E2E for the control-plane SPA. Runs the REAL backend: two `waf-controlplane`
# binaries (embed-ui) — token mode (governance OFF) + session mode (governance ON) — on one
# Postgres. See RUNBOOK §M. Locally this is `npm run e2e`; here we add a Postgres service and
# the browser install. GitHub Actions sets CI=true, so Playwright starts fresh servers,
# retries once, and forbids `.only`.

on:
  push:
    branches: [main, master]
    paths:
      - "crates/waf-controlplane/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "crates/waf-controlplane/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: playwright (token + session)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway DB — the binaries run their migrations on boot (see RUNBOOK §M).
      WAF_CP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    defaults:
      run:
        working-directory: crates/waf-controlplane/ui

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/waf-controlplane/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Audit UI dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (build UI + release binary + playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: crates/waf-controlplane/ui/playwright-report/
          retention-days: 7
