#
# Advisories OSV-Scanner (and OpenSSF Scorecard, which runs it) should not report, each with the
# reason it does not affect Light WAF. Every entry expires, so it gets looked at again: drop it as
# soon as a dependency update removes the affected version. Also listed in CHANGELOG.md.

# rsa 0.9 (via openidconnect, control plane only). The Marvin attack recovers a private key by timing
# RSA decryption / signing; no fixed version exists. The control plane never holds an RSA private
# key: it only VERIFIES the IdP's RS256 id_token signatures, with the IdP's public key.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-04-30
reason = "Marvin attack needs RSA private-key operations; openidconnect only verifies RS256 signatures with public keys"

# chrono 0.4 (via openidconnect/oauth2 in the control plane, rustls-acme in waf-tls-managed). An
# "unmaintained" notice, not a vulnerability: no flaw is reported and no version is fixed. No
# workspace crate uses chrono directly, and the latest openidconnect 4.1, oauth2 5.0 and rustls-acme
# 0.15.4 still depend on it. Drop once those move to jiff/time.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-04-30
reason = "Unmaintained notice, no vulnerability; only reachable through openidconnect/oauth2/rustls-acme, which have no chrono-free release"

# OSV-Scanner reads the osv-scanner.toml next to each lockfile, so the dashboard's npm advisories
# live in crates/waf-controlplane/ui/osv-scanner.toml, not here.
