[proxy]
listen = "0.0.0.0:8080"
backend = "http://127.0.0.1:8000"

# TLS termination on the listener. DEFAULT OFF → the listener serves plaintext (h1 + h2c).
# With enabled = true the listener serves ONLY TLS (h1/h2 negotiated via ALPN); there is NO
# plaintext fallback on the same port. An unreadable cert with enabled = true is a FATAL error at
# boot (fail-closed, no downgrade). Certificates from files are part of the core; ACME, rotation
# and mTLS PKI come from the waf-tls-managed component over the same TlsCertSource seam
# (BOUNDARY §3.2, ARCHITECTURE §9).
[tls]
enabled   = false
cert_path = "/etc/waf/tls/cert.pem"   # PEM chain (leaf first)
key_path  = "/etc/waf/tls/key.pem"    # PEM key (PKCS#8 / PKCS#1 / SEC1)
alpn      = ["h2", "http/1.1"]         # h2-ready (gRPC over TLS); h1-only clients fall back to http/1.1

[waf]
mode = "blocking"
block_threshold = 5
paranoia_level = 1          # 1..=4 — higher activates more (noisier) rules

# What to do when the WAF ITSELF is in trouble — an EXPLICIT policy per scenario.
# (The old waf.fail_open was removed: use this section.)
[resilience]
on_upstream_error   = "fail_closed"   # origin down/timeout -> 502 (closed) | 503 (open, retryable)
on_internal_error   = "fail_open"     # a panic/bug in a module must NOT take the site down
on_config_error     = "fail_open"     # invalid reload -> keep the last good config
on_parser_limit     = "fail_closed"   # normalization failed -> 400 (closed) | forward uninspected (open)
upstream_timeout_ms = 30000           # upstream round-trip cap (no hung workers)

# Point weight per severity class. Each matched rule contributes its severity's
# weight to the cumulative anomaly score; the request blocks at block_threshold.
# critical = 6 so a single high-confidence rule blocks on its own with a margin >= 1,
# while weak signals stay below the threshold (they only count when they accumulate).
# Matches the waf-core production default. Rationale: ARCHITECTURE §7.
[waf.severity_scores]
critical = 6
error    = 4
warning  = 3
notice   = 2

# L7 rate limiting (on_connection). Token bucket per key.
# key = "client_ip" is the client IP resolved by [network] below: behind a LB/CDN, set
# trusted_proxies, or every client shares the proxy's IP (one collective bucket).
[rate_limit]
enabled          = true
key              = "client_ip"
requests         = 100        # tokens per window
window_seconds   = 60
burst            = 100        # bucket capacity (default = requests)
action           = "block"    # "block" -> 429 | "score" -> adds to the anomaly score
score            = 5          # points when action = "score"
max_tracked_keys = 100000     # memory cap; a sweep evicts idle buckets

# SAFE client-IP resolution (shared by rate limiting, logging and IP reputation). The resolved
# IP is derived ONCE and stored in ctx.client_ip. Fail-safe: with trusted_proxies empty the XFF
# header is ALWAYS ignored and the peer address is used (an unconfigured deploy cannot be spoofed).
[network]
trusted_proxies  = []               # CIDRs of YOUR proxies/LBs/CDNs, e.g. ["10.0.0.0/8","::1"]
client_ip_header = "X-Forwarded-For"
trusted_hops     = 1                 # how many hops to trust, counting from the RIGHT (never the first IP)

[limits]
max_body_size    = 1048576   # 1 MiB
max_header_size  = 8192      # 8 KiB per header
max_headers      = 100
max_params       = 100
max_cookies      = 50
max_json_depth   = 20

[modules.sqli]
enabled = true

[modules.xss]
enabled = true

[modules.path_traversal]
enabled = true

[modules.rce]
enabled = true

[modules.lfi_rfi]
enabled = true

[modules.ssrf]
enabled = true

# ── signature modules (unambiguous signatures per attack category) ───────────────
[modules.ldap]
enabled = true

[modules.nosql]
enabled = true

[modules.mail]
enabled = true

[modules.ssti]
enabled = true

# Scanner/tool fingerprints on the User-Agent only (sqlmap/nuclei/… + OOB domains).
[modules.scanner]
enabled = true

# Server-Side Includes injection (<!--#exec|include|…).
[modules.ssi]
enabled = true

# XML External Entity (<!ENTITY / <!DOCTYPE…SYSTEM / encoding="UTF-7").
[modules.xxe]
enabled = true

[modules.header_injection]
enabled = true

# HTTP FRAMING validation (CL/TE) — a structural check, NOT content inspection.
# Default true: very low false-positive rate (fires only on illegal/ambiguous framing).
[modules.request_smuggling]
enabled = true

# STRUCTURAL GraphQL protections — like request_smuggling, NOT content inspection: DoS/abuse caps
# on the SHAPE of the GraphQL operation (depth/aliases/fields/directives/batch) plus an
# introspection policy, via a lexical parse. DEFAULT OFF: endpoint-specific, the caps must be
# tuned per app. Inspects JSON `query` / GET `?query=` only on `paths`, and every
# `application/graphql` body.
[modules.graphql]
enabled             = false
paths               = ["/graphql"]
max_depth           = 15            # max selection-set nesting (paren-aware)
max_aliases         = 30            # alias-bomb cap
max_fields          = 1000          # complexity proxy (number of selections)
max_directives      = 50
max_batch           = 10            # max operations in one batched request
block_introspection = false         # block __schema/__type → 403

# STRUCTURAL gRPC protections — like graphql, NOT content inspection: the CONTENT of protobuf
# fields is inspected by the regular modules (de-framing + leaf extraction); this module applies
# DoS caps on the SHAPE of the message plus a policy for compressed payloads. DEFAULT OFF:
# endpoint-specific, caps to be tuned. Matches application/grpc*.
# Note: gRPC runs over HTTP/2, which is ALWAYS served (h2c in plaintext, or h2 over TLS when
# [tls] is on). The gRPC module does NOT require TLS: the two settings are independent.
[modules.grpc]
enabled           = false
max_message_bytes = 4194304          # 4 MiB — cap on the total inspectable payload size
max_fields        = 4096             # field-bomb cap
max_depth         = 16               # depth-bomb cap (sub-message nesting)
on_compressed     = "reject"         # a compressed payload is opaque: "reject" (fail-closed) | "passthrough"

[modules.crs]
enabled = true
files   = ["test.conf"]
