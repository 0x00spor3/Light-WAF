# SPDX-License-Identifier: Apache-2.0
# Argo CD Application deploying the waf data-plane chart straight from the Light WAF
# repository, pinned to a release tag. The chart pulls the matching release image from GHCR;
# set image.repository to use your own build or a mirror.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-waf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0x00spor3/Light-WAF.git
    targetRevision: v1.0.2
    path: charts/waf
    helm:
      values: |
        image:
          repository: ghcr.io/0x00spor3/waf-enterprise
        waf:
          backend: http://myapp.prod.svc.cluster.local:8080
        metrics:
          podMonitor:
            enabled: true
          prometheusRule:
            enabled: true
          grafanaDashboard:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
