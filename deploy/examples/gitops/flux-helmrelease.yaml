# Flux: a GitRepository source + a HelmRelease that deploys the chart from the repo path
# (the charts are not published to a public Helm repo — Git is the source of truth).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: waf
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/0x00spor3/Light-WAF.git
  ref:
    tag: v1.0.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: myapp-waf
  namespace: prod
spec:
  interval: 10m
  chart:
    spec:
      chart: charts/waf
      sourceRef:
        kind: GitRepository
        name: waf
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/0x00spor3/waf-enterprise
    waf:
      backend: http://myapp.prod.svc.cluster.local:8080
    metrics:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      grafanaDashboard:
        enabled: true
