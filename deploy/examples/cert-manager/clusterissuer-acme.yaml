# SPDX-License-Identifier: Apache-2.0
# ACME (Let's Encrypt) ClusterIssuer using HTTP-01 solved by the nginx ingress. Reference it
# from the ingress (cert-manager.io/cluster-issuer) OR from the waf chart
# (tls.certManager.issuerRef) when the WAF terminates TLS itself.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
