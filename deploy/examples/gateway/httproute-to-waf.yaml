# SPDX-License-Identifier: Apache-2.0
# Gateway API variant: an HTTPRoute attaches to an existing Gateway and routes the host to
# the WAF Service. (This is upstream routing to the WAF — NOT the WAF acting as a Gateway
# controller itself; that needs multi-backend routing in the core, a strategic follow-on.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp
  namespace: prod
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - myapp.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myapp-waf # the WAF Service
          port: 8080
