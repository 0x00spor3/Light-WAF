# WAF config tailored for docker-compose (see docker-compose.node.yml). A minimal, self-contained
# setup: plain HTTP in front, the bundled `echo` service as the upstream, native detection modules on,
# and the CRS engine pointed at the shared managed file the node-agent maintains. No TLS, no Redis
# (leaving out the [enterprise] block keeps this bootable without a Redis to connect to).
[proxy]
listen = "0.0.0.0:8080"
backend = "http://echo:80"

[resilience]
on_upstream_error   = "fail_closed"   # origin down/timeout -> 502 (closed) | 503 (open, retryable)
on_internal_error   = "fail_open"     # a panic/bug in a module must NOT take the site down
on_config_error     = "fail_open"     # invalid reload -> keep the last good config
on_parser_limit     = "fail_closed"   # normalization failed -> 400 (closed) | forward uninspected (open)
upstream_timeout_ms = 30000           # upstream round-trip cap (no hung workers)

[waf]
mode = "blocking"
block_threshold = 3
paranoia_level = 3

[waf.severity_scores]
critical = 6
error    = 4
warning  = 3
notice   = 2


[limits]
max_body_size    = 1048576   # 1 MiB
max_header_size  = 8192      # 8 KiB per header
max_headers      = 100
max_params       = 100
max_cookies      = 50
max_json_depth   = 20

[modules.sqli]
enabled = true

[modules.xss]
enabled = true

[modules.path_traversal]
enabled = true

[modules.rce]
enabled = true

[modules.lfi_rfi]
enabled = true

[modules.ssrf]
enabled = true

# ── signature modules (unambiguous signatures per attack category) ───────────────
[modules.ldap]
enabled = true

[modules.nosql]
enabled = true

[modules.mail]
enabled = true

[modules.ssti]
enabled = true

# Scanner/tool fingerprints on the User-Agent only (sqlmap/nuclei/… + OOB domains).
[modules.scanner]
enabled = true

# Server-Side Includes injection (<!--#exec|include|…).
[modules.ssi]
enabled = true

# XML External Entity (<!ENTITY / <!DOCTYPE…SYSTEM / encoding="UTF-7").
[modules.xxe]
enabled = true

[modules.header_injection]
enabled = true

# HTTP FRAMING validation (CL/TE) — a structural check, NOT content inspection.
# Default true: very low false-positive rate (fires only on illegal/ambiguous framing).
[modules.request_smuggling]
enabled = true

# CRS engine → the managed SecRule file the node-agent writes (shared volume /etc/waf/rules).
# init-rules seeds it empty so this loads cleanly before the agent publishes anything.
[modules.crs]
enabled = true
files = ["/etc/waf/rules/managed.conf"]

[enterprise.crs_curated]
enabled = true

# ── Request Capture — captures the FULL request of denied requests ───────────────
# Buffers method/path/headers/cookies/body of blocked requests in a bounded ring OUTSIDE the
# datapath and ships them on the control plane's side channel POST /ingest/captures
# (host.docker.internal:9600), for the event drill-down in the dashboard.
# Raw by default -> redact sensitive names below (a redacted value never leaves the node; only
# the NAMES are reported, for the UI banner). The bearer token comes from WAF_CAPTURE_TOKEN (see
# docker-compose.node.yml), never from this file. Retention (hard delete) is the control plane's
# concern ([controlplane.captures]).
[enterprise.capture]
enabled          = true
controlplane_url = "http://host.docker.internal:9600"
token_env        = "WAF_CAPTURE_TOKEN"
max_body_bytes   = 65536      # larger bodies -> truncated + flagged
ring_capacity    = 1024
ring_bytes       = 33554432   # 32 MiB
ring_ttl_ms      = 5000       # TTL of an unshipped capture before eviction
queue_capacity   = 256        # shipper queue: full -> drop (never backpressure on the datapath)

[enterprise.capture.redaction]
headers     = ["cookie", "authorization", "set-cookie"]
body_fields = ["password", "token", "secret"]

[metrics]
enabled = true
listen  = "0.0.0.0:9090"   # scrape GET http://127.0.0.1:9090/metrics

#[rate_limit]
#enabled          = true
#key              = "client_ip"
#requests         = 100        # tokens per window
#window_seconds   = 60
#burst            = 100        # bucket capacity (default = requests)
#action           = "block"    # "block" -> 429 | "score" -> adds to the anomaly score
#score            = 5          # points when action = "score"
#max_tracked_keys = 100000     # memory cap; a sweep evicts idle buckets

